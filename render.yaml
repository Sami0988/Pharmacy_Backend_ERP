services:
  - type: web
    name: pharmacy-erp-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    postDeployCommand: pnpm db:push
    startCommand: pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: MFA_APP_NAME
        value: Pharmacy ERP
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
